{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:420px;margin:60px auto">
<h1>Anmeldung</h1>
{% if error %}<p style="color:#dc2626">{{ error }}</p>{% endif %}
<form method="post" action="/login">
<p><label>Benutzername<input name="username" required></label></p>
<p><label>Passwort<input type="password" name="password" required></label></p>
<button class="btn" type="submit">Anmelden</button>
</form>
<p class="mini">Demo: admin / admin123</p>
</div>
{% endblock %}
