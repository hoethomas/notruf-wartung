{% extends "base.html" %}{% block content %}
<div class="login-card card">
  <img class="login-logo" src="/static/notrufanlagen_logo.png" alt="Notrufanlagen Wartung">
  <h1>Anmeldung</h1>
  {% if error %}<p class="error-text">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <p><label>Benutzername<input name="username" autocomplete="username" required></label></p>
    <p><label>Passwort<input type="password" name="password" autocomplete="current-password" required></label></p>
    <button class="btn login-btn" type="submit">Anmelden</button>
  </form>
</div>
{% endblock %}
