<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title or "Notrufanlagen Wartung" }}</title>
<style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f5f7fa}
body{margin:0}.top{background:#172033;color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center}
.wrap{max-width:1200px;margin:24px auto;padding:0 16px}.card{background:white;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 2px 10px #0000000d}
h1,h2{margin-top:0}.btn{display:inline-block;border:0;border-radius:8px;padding:11px 15px;background:#2563eb;color:white;text-decoration:none;cursor:pointer}.btn.secondary{background:#64748b}.btn.success{background:#16a34a}.btn.danger{background:#dc2626}
input,select{padding:10px;border:1px solid #cbd5e1;border-radius:7px;font-size:16px;width:100%;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #e5e7eb;padding:9px;text-align:left;font-size:14px}th{background:#f1f5f9}
.status{padding:5px 9px;border-radius:99px;font-size:12px}.ok{background:#dcfce7}.nok{background:#fee2e2}.nf{background:#e2e8f0}
.check{display:flex;gap:6px;justify-content:center;align-items:center}.check input{position:absolute;opacity:0;pointer-events:none}.status-btn{width:42px;height:42px;border:1px solid #cbd5e1;border-radius:10px;padding:0;cursor:pointer;background:#fff;display:flex;align-items:center;justify-content:center;box-sizing:border-box;transition:.15s ease;position:relative}.status-icon{font-size:22px;font-weight:700;line-height:1}.status-btn.status-ok .status-icon{color:#16a34a}.status-btn.status-nok .status-icon{color:#dc2626}.status-btn.status-nf .status-icon{color:#64748b}.status-btn:has(input:checked){transform:scale(1.04);box-shadow:0 0 0 2px currentColor}.status-btn.status-ok:has(input:checked){background:#dcfce7;border-color:#16a34a;color:#16a34a}.status-btn.status-nok:has(input:checked){background:#fee2e2;border-color:#dc2626;color:#dc2626}.status-btn.status-nf:has(input:checked){background:#e2e8f0;border-color:#64748b;color:#475569}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.login-card{max-width:430px;margin:28px auto;text-align:center}.login-logo{display:block;width:min(100%,360px);height:auto;margin:0 auto 12px}.login-card h1{margin:8px 0 18px}.login-card form{text-align:left}.login-btn{width:100%;margin-top:4px;font-size:17px}
.mini{font-size:12px;color:#64748b}.manual{font-size:10px;color:#2563eb}.inline-form{display:flex;gap:10px;align-items:center}.inline-form input{flex:1}.success-text{color:#15803d}.error-text{color:#b91c1c}.actions{display:flex;gap:8px;flex-wrap:wrap}
.signature{border:2px dashed #94a3b8;border-radius:8px;background:#fff;max-width:500px;width:100%;touch-action:none}.detail-row{display:none;background:#fff7ed}.detail-row td{padding:10px}.nok-detail{margin:6px 0}.nok-detail textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #f59e0b;border-radius:7px;font:inherit;resize:vertical}

.mobile-hidden{display:none!important}.mobile-maintenance-intro{display:none}
@media(max-width:700px){
  .wrap{margin:10px auto;padding:0 10px}
  .top{padding:12px 14px;font-size:14px}
  .actions .btn{font-size:14px;padding:10px 12px}
  .maintenance-table-card{padding:10px;background:transparent;box-shadow:none}
  .mobile-maintenance-app{display:block}
  .maintenance-table-card>.maintenance-table{display:none!important}
  .mobile-room-overview{display:block}
  .mobile-app-title{display:flex;justify-content:space-between;align-items:end;padding:4px 4px 10px;font-size:18px}
  .mobile-app-title span{font-size:13px;color:#64748b;font-weight:600}.mobile-save-status{display:block;font-size:10px!important;font-weight:500!important;color:#16a34a!important;margin-top:2px}
  .mobile-progress{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:0 4px 12px}
  .mobile-progress>div{height:100%;width:0;background:#16a34a;border-radius:99px;transition:width .2s ease}
  .mobile-room-search{margin:0 0 10px;width:100%;height:48px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;padding:0 14px;font-size:16px;box-sizing:border-box}
  #mobileRoomList{display:flex;flex-direction:column;gap:8px}
  .mobile-room-card{width:100%;border:1px solid #e5e7eb;background:#fff;border-radius:14px;padding:12px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;box-shadow:0 2px 8px #0000000b;color:#172033}
  .mobile-room-card:active{transform:scale(.99)}
  .mobile-room-main{display:flex;flex-direction:column;gap:2px;min-width:0}
  .mobile-room-main b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mobile-room-main span,.mobile-room-main small{font-size:11px;color:#64748b}
  .mobile-room-counts{display:flex;align-items:center;gap:8px;white-space:nowrap}
  .mobile-room-counts i{font-style:normal;font-size:13px}
  .mobile-room-counts .count-ok{color:#16a34a}.mobile-room-counts .count-nok{color:#dc2626}.mobile-room-counts .count-nf{color:#64748b}
  .mobile-room-counts strong{font-size:28px;font-weight:400;color:#64748b;line-height:1}
  .mobile-room-editor{background:#fff;border-radius:14px;padding:10px 4px 4px}
  .mobile-editor-head{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;text-align:center;margin-bottom:6px}
  .mobile-editor-head>div{display:flex;flex-direction:column;gap:2px}.mobile-editor-head b{font-size:20px}.mobile-editor-head span{font-size:12px;color:#64748b}
  .mobile-nav-btn{width:44px;height:44px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-size:30px;color:#172033}
  .mobile-back-link{border:0;background:none;color:#2563eb;padding:6px 0 10px;font-size:14px}
  .mobile-component-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid #eef2f7;min-height:58px;box-sizing:border-box}
  .mobile-component-label{display:flex;flex-direction:column;gap:2px;min-width:0}.mobile-component-label b{font-size:16px}.mobile-component-label span{font-size:11px;color:#64748b;line-height:1.2}
  .mobile-status-actions{display:flex;gap:6px}.mobile-status-btn{width:48px;height:48px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;box-sizing:border-box;cursor:pointer}
  .mobile-status-btn input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}.mobile-status-btn>span{font-size:25px;font-weight:700;line-height:1}
  .mobile-status-btn.status-ok>span{color:#16a34a}.mobile-status-btn.status-nok>span{color:#dc2626}.mobile-status-btn.status-nf>span{color:#64748b}
  .mobile-status-btn.selected{transform:scale(1.04)}.mobile-status-btn.status-ok.selected{background:#dcfce7;border:3px solid #16a34a}.mobile-status-btn.status-nok.selected{background:#fee2e2;border:3px solid #dc2626}.mobile-status-btn.status-nf.selected{background:#e2e8f0;border:3px solid #64748b}
  .mobile-nok-details{margin:10px 0;padding:10px;background:#fff7ed;border-radius:10px}
  .mobile-next-btn,.mobile-prev-btn{width:100%;margin-top:10px;text-align:center}
  .mobile-prev-btn{margin-bottom:4px}
  .maintenance-table-card .scroll{overflow:visible}
  .mobile-maintenance-intro{display:flex;flex-direction:column;gap:4px;margin:0 0 10px;padding:12px 14px;background:#fff;border-radius:12px;box-shadow:0 2px 10px #0000000d}
  .mobile-maintenance-intro b{font-size:18px}
  .mobile-maintenance-intro span{font-size:12px;color:#64748b}
  .maintenance-table{display:block;width:100%}
  .maintenance-table thead,.maintenance-table>tbody>tr:first-child{display:none}
  .maintenance-table>tbody{display:block}
  .maintenance-table>tbody>tr:not(.detail-row){display:block;background:#fff;border-radius:14px;margin:0 0 12px;padding:10px 12px;box-shadow:0 2px 10px #0000000d;border:1px solid #e5e7eb}
  .maintenance-table>tbody>tr:not(.detail-row)>td{border:0;padding:6px 0;font-size:14px;box-sizing:border-box}
  .maintenance-table>tbody>tr:not(.detail-row)>td:first-child{display:block;font-size:18px;font-weight:700;padding:4px 0 10px;border-bottom:1px solid #e5e7eb;margin-bottom:4px}
  .maintenance-table>tbody>tr:not(.detail-row)>td:not(:first-child){display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;border-bottom:1px solid #eef2f7;min-height:54px}
  .maintenance-table>tbody>tr:not(.detail-row)>td:not(:first-child)::before{content:attr(data-component);font-weight:700;color:#172033;white-space:normal}
  .maintenance-table>tbody>tr:not(.detail-row)>td:last-child{border-bottom:0}
  .maintenance-table .check{justify-content:flex-end;gap:7px}
  .maintenance-table .status-btn{width:48px;height:48px;border-radius:12px}
  .maintenance-table .status-icon{font-size:25px}
  .maintenance-table .detail-row{display:none;background:#fff7ed}
  .maintenance-table .detail-row td{display:block!important;border:0!important;padding:10px!important}
  .scroll{overflow:visible}
  .grid{grid-template-columns:1fr;gap:12px}
  input,select{font-size:17px;min-height:48px}
  .card{padding:14px;margin-bottom:14px}
  .signature{max-width:100%;height:auto}
  .btn{min-height:46px}
}
@media(min-width:701px){.mobile-maintenance-intro{display:none}.mobile-maintenance-app{display:none}}

</style>
</head>
<body>
<div class="top"><b>Notrufanlagen Wartung</b>{% if user %}<span>{{ user.display_name }} · <a style="color:white" href="/logout">Abmelden</a></span>{% endif %}</div>
<div class="wrap">{% block content %}{% endblock %}</div>
</body>
</html>
